<form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
  <h3 class="form-title">🆕 Nueva Tarea</h3>
  
  <div class="form-group">
    <label for="title" class="form-label">Título *</label>
    <input 
      id="title"
      type="text" 
      formControlName="title" 
      placeholder="Ej: Migrar base de datos" 
      class="form-control"
    >
  </div>

  <div class="form-group">
    <label for="description" class="form-label">Descripción</label>
    <textarea 
      id="description"
      formControlName="description" 
      placeholder="Detalles de la tarea..." 
      class="form-control"
      rows="3"
    ></textarea>
  </div>
  
  <div class="form-row">
    <div class="form-group half-width">
      <label for="urgency" class="form-label">Urgencia</label>
      <select id="urgency" formControlName="urgency" class="form-control">
        <option value="LOW">Baja</option>
        <option value="MEDIUM">Media</option>
        <option value="HIGH">Alta</option>
        <option value="CRITICAL">Crítica</option>
      </select>
    </div>

    <div class="form-group half-width">
      <label for="effort" class="form-label">Esfuerzo (unidades)</label>
      <input 
        id="effort"
        type="number" 
        formControlName="estimated_effort" 
        min="0"
        class="form-control"
      >
    </div>
  </div>
  
  @if (taskForm.invalid && taskForm.dirty) {
    <div class="error-message">
      Por favor, completa los campos obligatorios correctamente. El esfuerzo no puede ser negativo.
    </div>
  }

  <button type="submit" [disabled]="taskForm.invalid" class="btn-submit">
    Crear Tarea
  </button>
</form>
